name: Backend CI

# Every push to any branch, and every pull request, so a branch is checked
# before it is merged rather than after.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover tests

      - name: Import sanity check
        # Catches import-time breakage (syntax errors, missing or circular
        # imports) in every module that backs the API or a pipeline, tested
        # or not. app.py itself is excluded: it creates a MongoDB index at
        # import time, which needs a reachable database. db.py only builds a
        # lazy client, so importing it is safe offline.
        run: |
          python -c "
          import importlib
          modules = [
              'auth', 'db', 'pipeline_api', 'sources_api', 'storage_api', 'early_warning_api', 'stream_api',
              'account_api', 'feedback_api', 'source_context', 'upload_store',
              'detection.predict', 'detection.train', 'detection.evaluate', 'detection.isolation_forest',
              'optimization.ga_isolation_forest', 'optimization.model_evolution',
              'feature_engineering.block_metadata', 'feature_engineering.category_encoder',
              'smart_storage.policy', 'smart_storage.optimizer', 'smart_storage.baselines', 'smart_storage.data',
              'early_warning.model', 'early_warning.prefix_features',
              'streaming.block_state', 'streaming.processor', 'streaming.scoring', 'streaming.sources',
              'streaming.producer', 'streaming.syslog_receiver',
              'multi_source.pipeline', 'multi_source.sources', 'multi_source.upload', 'multi_source.labels',
              'parser.hdfs_parser', 'parser.openstack_parser', 'parser.apache_parser',
              'parser.cloudtrail_parser', 'parser.django_parser',
          ]
          for name in modules:
              importlib.import_module(name)
          print(f'Imported {len(modules)} modules OK')
          "
