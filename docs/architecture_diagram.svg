<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>MorphGuard architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .ingest { fill: #eff6ff; stroke: #3b82f6; }
      .detect { fill: #ecfdf5; stroke: #10b981; }
      .train { fill: #fff7ed; stroke: #f97316; }
      .new { fill: #f5f3ff; stroke: #8b5cf6; }
      .ui { fill: #f8fafc; stroke: #334155; }
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12.5px; fill: #334155; }
      .s { font-size: 11px; fill: #64748b; }
      .lane { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.5px; }
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">MorphGuard — architecture</text>
  <text x="620" y="58" text-anchor="middle" class="s">Every box below is implemented. Dashed arrows are the feedback and promotion paths.</text>

  <!-- lane labels -->
  <text x="24" y="98" class="lane">INGEST</text>
  <text x="24" y="318" class="lane">DETECT</text>
  <text x="24" y="560" class="lane">LEARN</text>

  <!-- sources -->
  <rect x="24" y="110" width="200" height="176" rx="10" class="box ingest"/>
  <text x="40" y="136" class="h">Log sources (5)</text>
  <text x="40" y="160" class="t">HDFS — ground truth</text>
  <text x="40" y="181" class="t">OpenStack — by-run labels</text>
  <text x="40" y="202" class="t">Apache — injected</text>
  <text x="40" y="223" class="t">CloudTrail — weak rules</text>
  <text x="40" y="244" class="t">Django — synthetic</text>
  <text x="40" y="270" class="s">raw data on Hugging Face</text>

  <!-- entry paths -->
  <rect x="264" y="110" width="210" height="80" rx="10" class="box ingest"/>
  <text x="280" y="136" class="h">Batch &amp; upload</text>
  <text x="280" y="158" class="t">pipeline scripts, Log Sources</text>
  <text x="280" y="176" class="t">upload (any source)</text>

  <rect x="264" y="206" width="210" height="80" rx="10" class="box ingest"/>
  <text x="280" y="232" class="h">Kafka + stream processor</text>
  <text x="280" y="254" class="t">topic per source; syslog</text>
  <text x="280" y="272" class="t">receiver; Python consumer</text>

  <!-- parser + features -->
  <rect x="514" y="110" width="220" height="80" rx="10" class="box ingest"/>
  <text x="530" y="136" class="h">Parser / normalization</text>
  <text x="530" y="158" class="t">one parser per source →</text>
  <text x="530" y="176" class="t">common log schema</text>

  <rect x="514" y="206" width="220" height="80" rx="10" class="box ingest"/>
  <text x="530" y="232" class="h">Feature extraction</text>
  <text x="530" y="254" class="t">8 features per block, stable</text>
  <text x="530" y="272" class="t">category vocabulary per source</text>

  <!-- detection -->
  <rect x="264" y="330" width="250" height="110" rx="10" class="box detect"/>
  <text x="280" y="356" class="h">Detection engine</text>
  <text x="280" y="378" class="t">deployed Isolation Forest per</text>
  <text x="280" y="396" class="t">source → score → threshold →</text>
  <text x="280" y="414" class="t">normal / suspicious, severity</text>
  <text x="280" y="432" class="s">held-out F1 0.528 (HDFS V2)</text>

  <rect x="544" y="330" width="230" height="110" rx="10" class="box new"/>
  <text x="560" y="356" class="h">Early warning</text>
  <text x="560" y="378" class="t">Isolation Forest on a block's</text>
  <text x="560" y="396" class="t">first k events; alert before</text>
  <text x="560" y="414" class="t">the block finishes</text>
  <text x="560" y="432" class="s">k = 20: precision 0.85 on HDFS</text>

  <rect x="804" y="330" width="230" height="110" rx="10" class="box new"/>
  <text x="820" y="356" class="h">Smart Storage</text>
  <text x="820" y="378" class="t">GA-tuned importance score →</text>
  <text x="820" y="396" class="t">HOT (all lines) / WARM</text>
  <text x="820" y="414" class="t">(summary) / COLD (metadata)</text>
  <text x="820" y="432" class="s">~66% of lines saved, 94% kept in full</text>

  <!-- dashboard -->
  <rect x="1060" y="110" width="160" height="330" rx="10" class="box ui"/>
  <text x="1076" y="136" class="h">Dashboard</text>
  <text x="1076" y="160" class="t">React + Flask API</text>
  <text x="1076" y="186" class="t">source picker on</text>
  <text x="1076" y="204" class="t">every page</text>
  <text x="1076" y="230" class="t">Detections,</text>
  <text x="1076" y="248" class="t">Analytics, Models,</text>
  <text x="1076" y="266" class="t">Smart Storage,</text>
  <text x="1076" y="284" class="t">Live Stream,</text>
  <text x="1076" y="302" class="t">Log Sources,</text>
  <text x="1076" y="320" class="t">Settings</text>
  <text x="1076" y="350" class="s">MongoDB Atlas:</text>
  <text x="1076" y="366" class="s">accounts, uploads,</text>
  <text x="1076" y="382" class="s">stream alerts,</text>
  <text x="1076" y="398" class="s">analyst feedback</text>

  <!-- learn lane -->
  <rect x="264" y="576" width="250" height="120" rx="10" class="box train"/>
  <text x="280" y="602" class="h">Offline training (GA)</text>
  <text x="280" y="624" class="t">PyGAD searches features,</text>
  <text x="280" y="642" class="t">trees, sample size, threshold</text>
  <text x="280" y="660" class="t">→ candidate model</text>
  <text x="280" y="682" class="s">Run Retrain Cycle, per source</text>

  <rect x="544" y="576" width="230" height="120" rx="10" class="box train"/>
  <text x="560" y="602" class="h">Evaluate → promote</text>
  <text x="560" y="624" class="t">candidate replaces the live</text>
  <text x="560" y="642" class="t">model only if its F1 is higher;</text>
  <text x="560" y="660" class="t">rejected ones archived</text>
  <text x="560" y="682" class="s">versions per source, rollbacks logged</text>

  <rect x="804" y="576" width="230" height="120" rx="10" class="box new"/>
  <text x="820" y="602" class="h">Analyst feedback</text>
  <text x="820" y="624" class="t">confirm / false alarm on</text>
  <text x="820" y="642" class="t">detections → labels for the</text>
  <text x="820" y="660" class="t">next retrain (positive /</text>
  <text x="820" y="678" class="t">unlabeled flow)</text>

  <rect x="24" y="576" width="200" height="120" rx="10" class="box new"/>
  <text x="40" y="602" class="h">Model comparison</text>
  <text x="40" y="624" class="t">Autoencoder vs Isolation</text>
  <text x="40" y="642" class="t">Forest, same held-out</text>
  <text x="40" y="660" class="t">splits</text>
  <text x="40" y="682" class="s">IF steadier: F1 ±0.014 vs ±0.137</text>

  <!-- edges: ingest -->
  <path class="edge" d="M224,150 H262"/>
  <path class="edge" d="M224,246 H262"/>
  <path class="edge" d="M474,150 H512"/>
  <path class="edge" d="M474,246 H512"/>
  <path class="edge" d="M624,190 V204"/>
  <!-- features to detection / early warning / storage -->
  <path class="edge" d="M560,286 V308 H389 V328"/>
  <path class="edge" d="M659,286 V328"/>
  <path class="edge" d="M514,420 H530 V480 H919 V442"/>
  <text x="600" y="474" class="s">scores feed the storage importance</text>
  <!-- outputs to dashboard -->
  <path class="edge" d="M500,330 V316 H1058"/>
  <text x="926" y="311" class="s">detections, alerts</text>
  <path class="edge" d="M1034,385 H1058"/>
  <path d="M774,345 H790 V316" stroke="#475569" stroke-width="1.5" fill="none"/>
  <!-- learn lane -->
  <path class="edge" d="M714,286 V300 H919 V328"/>
  <path class="edge" d="M389,440 V574"/>
  <text x="396" y="560" class="s">labeled blocks</text>
  <path class="edge" d="M514,636 H542"/>
  <path class="edge dash" d="M659,576 V520 H440 V442"/>
  <text x="448" y="514" class="s">promote</text>
  <path class="edge dash" d="M1140,440 V740 H919 V698"/>
  <text x="1000" y="734" class="s">verdicts from the dashboard</text>
  <path class="edge dash" d="M804,636 H776"/>
  <path class="edge dash" d="M224,636 H262"/>
  <text x="228" y="628" class="s">why IF</text>

  <text x="620" y="780" text-anchor="middle" class="s">Kafka + Python processor replaces the Flink box of the first design (reasons: docs/architecture.md §3.8). Dashed boxes of the first design — extra model, feedback flow — are now built.</text>
</svg>
